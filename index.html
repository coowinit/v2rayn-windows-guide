<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="一个轻量、无框架、可复用的 GitHub README 在线阅读页面。">
  <title>README 在线指南</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: rgba(255,255,255,.88);
      --surface-solid: #fff;
      --surface-muted: #f4f6fa;
      --text: #1a2030;
      --muted: #667085;
      --faint: #98a2b3;
      --line: #e4e7ec;
      --line-strong: #d0d5dd;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --accent-strong: #1748b5;
      --success: #0b7a53;
      --code-bg: #101828;
      --code-text: #e8eefc;
      --mark: #fff0a6;
      --shadow: 0 14px 40px rgba(15,23,42,.08);
      --shadow-sm: 0 5px 18px rgba(15,23,42,.07);
      --radius: 18px;
      --sidebar: 282px;
      --header: 70px;
      --content: 860px;
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    [data-theme="dark"] {
      --bg: #0c111d;
      --surface: rgba(18,25,40,.88);
      --surface-solid: #121928;
      --surface-muted: #182132;
      --text: #eaecf0;
      --muted: #a7b0c0;
      --faint: #7a8699;
      --line: #273244;
      --line-strong: #3b4658;
      --accent: #74a4ff;
      --accent-soft: #172a50;
      --accent-strong: #a9c5ff;
      --success: #5dd6a8;
      --code-bg: #080d17;
      --code-text: #e6edf7;
      --mark: #6d5816;
      --shadow: 0 18px 48px rgba(0,0,0,.28);
      --shadow-sm: 0 6px 20px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header) + 22px); }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 12% -10%, rgba(37,99,235,.10), transparent 34rem),
        radial-gradient(circle at 92% 8%, rgba(14,165,233,.07), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.75;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--accent-strong); }
    button, input { font: inherit; }
    button { color: inherit; }
    ::selection { background: rgba(37,99,235,.24); }

    .skip-link {
      position: fixed; top: 8px; left: 8px; z-index: 999;
      transform: translateY(-150%); padding: 8px 14px;
      border-radius: 8px; background: var(--surface-solid); color: var(--text);
    }
    .skip-link:focus { transform: translateY(0); }

    .progress { position: fixed; inset: 0 0 auto; height: 3px; z-index: 100; background: transparent; }
    .progress span { display: block; width: 0; height: 100%; background: linear-gradient(90deg,#2563eb,#06b6d4); transition: width .08s linear; }

    .topbar {
      position: sticky; top: 0; z-index: 60; height: var(--header);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(18px) saturate(140%);
    }
    .topbar-inner { width: min(1440px, 100%); height: 100%; margin: auto; padding: 0 28px; display: flex; align-items: center; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; color: var(--text); text-decoration: none; }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto;
      border-radius: 11px; background: linear-gradient(145deg,#2563eb,#1646ad); color: #fff;
      box-shadow: 0 7px 18px rgba(37,99,235,.25);
    }
    .brand-title { overflow: hidden; font-weight: 720; letter-spacing: -.02em; text-overflow: ellipsis; white-space: nowrap; }
    .brand-subtitle { margin-left: 4px; color: var(--faint); font-size: 12px; font-weight: 500; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0;
      border: 1px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer;
      box-shadow: 0 1px 2px rgba(15,23,42,.02); transition: .18s ease;
    }
    .icon-btn:hover { border-color: var(--line-strong); background: var(--surface-solid); transform: translateY(-1px); }
    .icon-btn svg { width: 19px; height: 19px; }
    .mobile-menu { display: none; }

    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 28px; display: grid; grid-template-columns: var(--sidebar) minmax(0,1fr); gap: 34px; align-items: start; }
    .sidebar { position: sticky; top: calc(var(--header) + 28px); height: calc(100vh - var(--header) - 56px); display: flex; flex-direction: column; gap: 14px; }
    .side-card { min-height: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
    .search-wrap { position: relative; padding: 12px; }
    .search-wrap svg { position: absolute; top: 23px; left: 25px; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
    .search {
      width: 100%; height: 42px; padding: 0 36px 0 38px; border: 1px solid var(--line);
      border-radius: 11px; outline: none; background: var(--surface-solid); color: var(--text); transition: .2s;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent); }
    .search-clear { position: absolute; top: 19px; right: 20px; width: 27px; height: 27px; border: 0; background: none; color: var(--faint); cursor: pointer; display: none; }
    .search-meta { padding: 0 14px 12px; color: var(--faint); font-size: 12px; }
    .toc-card { flex: 1; display: flex; flex-direction: column; }
    .side-heading { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px 10px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .toc { min-height: 0; padding: 2px 10px 15px; overflow: auto; scrollbar-width: thin; }
    .toc a { display: block; margin: 1px 0; padding: 7px 10px; border-radius: 9px; color: var(--muted); font-size: 13px; line-height: 1.4; text-decoration: none; transition: .15s; }
    .toc a[data-level="3"] { padding-left: 23px; font-size: 12.5px; }
    .toc a:hover { color: var(--text); background: var(--surface-muted); }
    .toc a.active { color: var(--accent-strong); background: var(--accent-soft); font-weight: 650; }

    .main { min-width: 0; }
    .reader { width: min(var(--content),100%); margin: 0 auto 90px; padding: clamp(34px,6vw,72px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-solid); box-shadow: var(--shadow); }
    .doc-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb,var(--success) 13%,transparent); }
    .doc-meta .spacer { flex: 1; }
    .doc-meta button { border: 0; padding: 3px 5px; background: none; color: var(--muted); cursor: pointer; }

    .markdown { overflow-wrap: anywhere; }
    .markdown > :first-child { margin-top: 0 !important; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { position: relative; color: var(--text); line-height: 1.28; letter-spacing: -.025em; }
    .markdown h1 { margin: 0 0 24px; font-size: clamp(2rem,5vw,3.15rem); font-weight: 800; }
    .markdown h2 { margin: 3.4rem 0 1rem; padding-top: .2rem; font-size: clamp(1.45rem,3vw,1.9rem); font-weight: 760; }
    .markdown h2::after { content: ""; display: block; width: 44px; height: 3px; margin-top: 12px; border-radius: 4px; background: linear-gradient(90deg,var(--accent),#22c1dc); }
    .markdown h3 { margin: 2.2rem 0 .75rem; font-size: 1.25rem; font-weight: 720; }
    .markdown h4 { margin: 1.6rem 0 .6rem; font-size: 1.08rem; }
    .anchor { position: absolute; left: -26px; padding: 0 6px; color: var(--faint); opacity: 0; text-decoration: none; }
    .markdown h2:hover .anchor, .markdown h3:hover .anchor, .markdown h4:hover .anchor, .anchor:focus { opacity: 1; }
    .markdown p { margin: .85rem 0; }
    .markdown strong { color: var(--text); font-weight: 700; }
    .markdown hr { height: 1px; margin: 2.8rem 0; border: 0; background: var(--line); }
    .markdown blockquote { margin: 1.4rem 0; padding: 14px 18px; border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; background: var(--accent-soft); color: var(--muted); }
    .markdown blockquote p { margin: 0; }
    .markdown ul, .markdown ol { margin: .8rem 0; padding-left: 1.55rem; }
    .markdown li { margin: .32rem 0; padding-left: .2rem; }
    .markdown li::marker { color: var(--accent); font-weight: 650; }
    .task { list-style: none; margin-left: -1.35rem; }
    .task input { margin-right: 9px; accent-color: var(--accent); }

    .table-wrap { width: 100%; margin: 1.35rem 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    .markdown table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .markdown th, .markdown td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .markdown th { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .markdown tr:last-child td { border-bottom: 0; }
    .markdown tr:hover td { background: color-mix(in srgb,var(--surface-muted) 64%,transparent); }

    .markdown code { padding: .15em .42em; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-muted); color: color-mix(in srgb,var(--accent-strong) 82%,var(--text)); font-family: var(--font-mono); font-size: .88em; }
    .code-block { position: relative; margin: 1.35rem 0; border: 1px solid color-mix(in srgb,var(--line) 60%,#000); border-radius: 13px; overflow: hidden; background: var(--code-bg); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .code-head { display: flex; align-items: center; min-height: 38px; padding: 0 10px 0 15px; border-bottom: 1px solid rgba(255,255,255,.1); color: #98a7bd; font: 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
    .code-head button { margin-left: auto; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: #b6c1d2; cursor: pointer; font: 12px/1 var(--font-sans); }
    .code-head button:hover { background: rgba(255,255,255,.1); color: #fff; }
    .code-block pre { margin: 0; padding: 18px 20px; overflow: auto; color: var(--code-text); font: 13px/1.7 var(--font-mono); tab-size: 2; }
    .code-block pre code { padding: 0; border: 0; background: none; color: inherit; font: inherit; }
    .markdown mark { padding: .05em .14em; border-radius: 3px; background: var(--mark); color: inherit; }

    .loading { display: grid; place-items: center; min-height: 420px; color: var(--muted); text-align: center; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 15px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { max-width: 580px; margin: 80px auto; padding: 26px; border: 1px solid #f3b4b4; border-radius: 14px; background: color-mix(in srgb,#fff1f1 75%,var(--surface-solid)); }
    .error h2 { margin-top: 0; }

    .back-top { position: fixed; right: 24px; bottom: 24px; z-index: 40; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s; }
    .back-top.show { opacity: 1; pointer-events: auto; transform: none; }
    .overlay { display: none; }

    @media (max-width: 980px) {
      .topbar-inner { padding: 0 18px; }
      .brand-subtitle { display: none; }
      .mobile-menu { display: inline-grid; }
      .shell { display: block; padding: 18px; }
      .sidebar { position: fixed; z-index: 80; top: 0; left: 0; width: min(86vw,320px); height: 100dvh; padding: 18px; background: var(--bg); transform: translateX(-105%); transition: transform .25s ease; }
      .sidebar.open { transform: translateX(0); }
      .overlay { position: fixed; z-index: 70; inset: 0; display: block; background: rgba(6,12,24,.48); opacity: 0; pointer-events: none; transition: opacity .25s; backdrop-filter: blur(3px); }
      .overlay.show { opacity: 1; pointer-events: auto; }
      .reader { padding: clamp(25px,6vw,54px); }
    }

    @media (max-width: 560px) {
      :root { --header: 62px; }
      .shell { padding: 10px; }
      .reader { border-radius: 14px; padding: 25px 20px 42px; }
      .brand-title { max-width: 160px; font-size: 14px; }
      .top-actions { gap: 5px; }
      .icon-btn { width: 37px; height: 37px; }
      .print-btn { display: none; }
      .doc-meta .updated { display: none; }
      .markdown h1 { font-size: 2rem; }
      .markdown h2 { margin-top: 2.8rem; }
      .anchor { display: none; }
      .back-top { right: 14px; bottom: 14px; }
    }

    @media print {
      :root { --text:#111; --muted:#444; --line:#ddd; --surface-solid:#fff; --surface-muted:#f4f4f4; }
      body { background: #fff; font-size: 11pt; }
      .topbar, .sidebar, .progress, .back-top, .doc-meta { display: none !important; }
      .shell { display: block; width: 100%; padding: 0; }
      .reader { width: 100%; margin: 0; padding: 0; border: 0; box-shadow: none; }
      .markdown h2, .markdown h3 { break-after: avoid; }
      .code-block, .table-wrap, blockquote { break-inside: avoid; }
      a { color: #111; text-decoration: none; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 8pt; color: #666; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">跳到正文</a>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="打开目录" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#top" aria-label="返回文档顶部">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4M8 12h8M8 16h6"/></svg>
        </span>
        <span class="brand-title" id="brandTitle">README 在线指南</span>
        <span class="brand-subtitle">DOCUMENTATION</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn print-btn" id="printBtn" aria-label="打印或导出 PDF" title="打印或导出 PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="切换颜色主题" title="切换颜色主题">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9c0-.45-.04-.9-.1-1.32A7 7 0 0 1 13.32 3.1C12.9 3.04 12.45 3 12 3Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>
  <div class="shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="文档导航">
      <div class="side-card">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input class="search" id="searchInput" type="search" placeholder="搜索本文…" autocomplete="off" aria-label="搜索文档">
          <button class="search-clear" id="searchClear" aria-label="清除搜索">×</button>
        </div>
        <div class="search-meta" id="searchMeta">输入关键词搜索正文</div>
      </div>
      <div class="side-card toc-card">
        <div class="side-heading"><span>本文目录</span><span id="tocCount">—</span></div>
        <nav class="toc" id="toc"></nav>
      </div>
    </aside>

    <main class="main" id="content" tabindex="-1">
      <article class="reader">
        <div class="doc-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span>README.md</span>
          <span class="spacer"></span>
          <span class="updated" id="readTime">正在读取…</span>
          <button id="reloadBtn" title="重新载入 README.md">重新载入</button>
        </div>
        <div class="markdown" id="markdown">
          <div class="loading"><div><div class="spinner"></div><div>正在加载 README.md</div></div></div>
        </div>
      </article>
    </main>
  </div>

  <button class="icon-btn back-top" id="backTop" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <script>
    (() => {
      'use strict';

      /* 修改这里即可复用到其他 Markdown 文件。 */
      const CONFIG = {
        markdownFile: 'README.md',
        fallbackTitle: 'README 在线指南',
        rememberTheme: true
      };

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const els = {
        markdown: $('#markdown'), toc: $('#toc'), tocCount: $('#tocCount'),
        brandTitle: $('#brandTitle'), readTime: $('#readTime'), search: $('#searchInput'),
        searchMeta: $('#searchMeta'), clear: $('#searchClear'), theme: $('#themeBtn'),
        themeIcon: $('#themeIcon'), menu: $('#menuBtn'), sidebar: $('#sidebar'), overlay: $('#overlay'),
        progress: $('#progressBar'), backTop: $('#backTop'), reload: $('#reloadBtn'), print: $('#printBtn')
      };

      let rawMarkdown = '';
      let headingObserver;
      let searchTimer;

      const escapeHtml = value => String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

      const escapeAttr = value => escapeHtml(value).replace(/`/g, '&#096;');

      function slugify(text, used) {
        let base = text.toLowerCase().replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, '')
          .trim().replace(/[\s/]+/g, '-').replace(/[^\w\-\u4e00-\u9fff]/g, '').replace(/-+/g, '-');
        if (!base) base = 'section';
        let slug = base, i = 2;
        while (used.has(slug)) slug = `${base}-${i++}`;
        used.add(slug);
        return slug;
      }

      function inline(text) {
        let value = escapeHtml(text);
        const inlineCode = [];
        value = value.replace(/`([^`]+)`/g, (_, code) => `\u0000I${inlineCode.push(code) - 1}\u0000`);
        value = value.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+|[^\s)]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,
          (_, alt, url, title) => `<img src="${escapeAttr(url)}" alt="${alt}" loading="lazy"${title ? ` title="${title}"` : ''}>`);
        value = value.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|[^\s)]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,
          (_, label, url, title) => `<a href="${escapeAttr(url)}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener noreferrer"' : ''}${title ? ` title="${title}"` : ''}>${label}</a>`);
        value = value.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
        value = value.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        value = value.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
        value = value.replace(/\u0000I(\d+)\u0000/g, (_, n) => `<code>${inlineCode[Number(n)]}</code>`);
        return value;
      }

      function splitTableRow(line) {
        return line.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(cell => cell.trim().replace(/\\\|/g, '|'));
      }

      function renderMarkdown(source) {
        const lines = source.replace(/\r\n?/g, '\n').split('\n');
        const out = [], used = new Set();
        let i = 0, paragraph = [], list = null;

        const flushParagraph = () => {
          if (paragraph.length) {
            out.push(`<p>${inline(paragraph.join(' ').trim())}</p>`);
            paragraph = [];
          }
        };
        const closeList = () => {
          if (list) { out.push(`</${list}>`); list = null; }
        };
        const flush = () => { flushParagraph(); closeList(); };

        while (i < lines.length) {
          const line = lines[i];

          const fence = line.match(/^\s*```\s*([^\s`]*)\s*$/);
          if (fence) {
            flush();
            const lang = fence[1] || 'text', code = [];
            i++;
            while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]);
            out.push(`<div class="code-block"><div class="code-head"><span>${escapeHtml(lang)}</span><button type="button" class="copy-code">复制</button></div><pre><code>${escapeHtml(code.join('\n'))}</code></pre></div>`);
            i++; continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
          if (heading) {
            flush();
            const level = heading[1].length, text = heading[2], id = slugify(text, used);
            out.push(`<h${level} id="${id}"><a class="anchor" href="#${id}" aria-label="链接到此标题">#</a>${inline(text)}</h${level}>`);
            i++; continue;
          }

          if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }

          if (/^>\s?/.test(line)) {
            flush(); const quote = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
            out.push(`<blockquote><p>${inline(quote.join(' '))}</p></blockquote>`); continue;
          }

          if (i + 1 < lines.length && line.includes('|') && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
            flush();
            const headers = splitTableRow(line); i += 2; const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(splitTableRow(lines[i++]));
            out.push('<div class="table-wrap"><table><thead><tr>' + headers.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
              rows.map(row => '<tr>' + headers.map((_, n) => `<td>${inline(row[n] || '')}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
            continue;
          }

          const item = line.match(/^\s*([-+*]|\d+[.)])\s+(.+)$/);
          if (item) {
            flushParagraph();
            const type = /^\d/.test(item[1]) ? 'ol' : 'ul';
            if (list !== type) { closeList(); out.push(`<${type}>`); list = type; }
            let content = item[2], taskClass = '';
            const task = content.match(/^\[([ xX])\]\s+(.+)/);
            if (task) { taskClass = ' class="task"'; content = `<input type="checkbox" disabled${task[1].toLowerCase() === 'x' ? ' checked' : ''}>${inline(task[2])}`; }
            else content = inline(content);
            out.push(`<li${taskClass}>${content}</li>`); i++; continue;
          }

          if (!line.trim()) { flush(); i++; continue; }
          closeList(); paragraph.push(line.trim()); i++;
        }
        flush();
        return out.join('\n');
      }

      function enhanceDocument() {
        $$('.table-wrap table', els.markdown).forEach(table => table.setAttribute('role', 'table'));
        $$('.copy-code', els.markdown).forEach(button => button.addEventListener('click', async () => {
          const code = button.closest('.code-block').querySelector('code').textContent;
          try {
            await navigator.clipboard.writeText(code);
            button.textContent = '已复制';
          } catch (_) {
            const area = document.createElement('textarea'); area.value = code; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); button.textContent = '已复制';
          }
          setTimeout(() => button.textContent = '复制', 1400);
        }));
        $$('img', els.markdown).forEach(img => img.addEventListener('error', () => img.hidden = true));
      }

      function buildToc() {
        const headings = $$('h2, h3', els.markdown);
        els.toc.innerHTML = headings.map(h => `<a href="#${h.id}" data-level="${h.tagName.slice(1)}">${h.textContent.replace(/^#/, '').trim()}</a>`).join('');
        els.tocCount.textContent = headings.length;
        $$('a', els.toc).forEach(a => a.addEventListener('click', closeMenu));

        if (headingObserver) headingObserver.disconnect();
        headingObserver = new IntersectionObserver(entries => {
          const visible = entries.filter(e => e.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          $$('a', els.toc).forEach(a => a.classList.toggle('active', a.hash === `#${visible.target.id}`));
        }, { rootMargin: '-15% 0px -72% 0px', threshold: 0 });
        headings.forEach(h => headingObserver.observe(h));
      }

      function updateTitle() {
        const h1 = $('h1', els.markdown);
        const title = h1 ? h1.textContent.trim() : CONFIG.fallbackTitle;
        document.title = title;
        els.brandTitle.textContent = title;
        const words = rawMarkdown.replace(/```[\s\S]*?```/g, '').replace(/[#>*_`|\-]/g, ' ').trim().length;
        els.readTime.textContent = `约 ${Math.max(1, Math.ceil(words / 450))} 分钟阅读`;
      }

      async function loadMarkdown() {
        els.markdown.innerHTML = '<div class="loading"><div><div class="spinner"></div><div>正在加载 README.md</div></div></div>';
        els.toc.innerHTML = ''; els.tocCount.textContent = '—';
        try {
          const response = await fetch(`${CONFIG.markdownFile}?v=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          rawMarkdown = await response.text();
          if (!rawMarkdown.trim()) throw new Error('README.md 内容为空');
          els.markdown.innerHTML = renderMarkdown(rawMarkdown);
          enhanceDocument(); buildToc(); updateTitle();
          els.searchMeta.textContent = '输入关键词搜索正文';
        } catch (error) {
          els.markdown.innerHTML = `<div class="error"><h2>无法载入 README.md</h2><p>请确认 <code>index.html</code> 与 <code>${escapeHtml(CONFIG.markdownFile)}</code> 位于同一目录，并通过 GitHub Pages 或本地 Web 服务器访问。</p><p><strong>本地预览：</strong></p><div class="code-block"><pre><code>python3 -m http.server 8080</code></pre></div><p>然后打开 <code>http://localhost:8080</code>。</p><p><small>${escapeHtml(error.message)}</small></p></div>`;
          els.readTime.textContent = '载入失败';
        }
      }

      function searchDocument(query) {
        const q = query.trim();
        els.clear.style.display = q ? 'block' : 'none';
        if (!q) {
          els.markdown.innerHTML = renderMarkdown(rawMarkdown); enhanceDocument(); buildToc(); updateTitle();
          els.searchMeta.textContent = '输入关键词搜索正文'; return;
        }
        els.markdown.innerHTML = renderMarkdown(rawMarkdown); enhanceDocument(); buildToc();
        const walker = document.createTreeWalker(els.markdown, NodeFilter.SHOW_TEXT, {
          acceptNode(node) { return node.parentElement.closest('code, script, style, .anchor') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
        });
        const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
        let count = 0; const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); const regex = new RegExp(escaped, 'gi');
        nodes.forEach(node => {
          const text = node.nodeValue; if (!regex.test(text)) return; regex.lastIndex = 0;
          const fragment = document.createDocumentFragment(); let last = 0;
          text.replace(regex, (match, offset) => { fragment.append(text.slice(last, offset)); const mark = document.createElement('mark'); mark.textContent = match; fragment.append(mark); last = offset + match.length; count++; });
          fragment.append(text.slice(last)); node.replaceWith(fragment);
        });
        els.searchMeta.textContent = count ? `找到 ${count} 处匹配` : '没有找到匹配内容';
        const first = $('mark', els.markdown); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function applyTheme(theme) {
        const actual = theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        document.documentElement.dataset.theme = actual;
        $('meta[name="theme-color"]').content = actual === 'dark' ? '#0c111d' : '#f7f8fb';
        els.themeIcon.innerHTML = actual === 'dark'
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>'
          : '<path d="M12 3a9 9 0 1 0 9 9c0-.45-.04-.9-.1-1.32A7 7 0 0 1 13.32 3.1C12.9 3.04 12.45 3 12 3Z"/>';
      }

      function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next); if (CONFIG.rememberTheme) localStorage.setItem('readme-theme', next);
      }

      function openMenu() { els.sidebar.classList.add('open'); els.overlay.classList.add('show'); els.menu.setAttribute('aria-expanded', 'true'); setTimeout(() => els.search.focus(), 260); }
      function closeMenu() { els.sidebar.classList.remove('open'); els.overlay.classList.remove('show'); els.menu.setAttribute('aria-expanded', 'false'); }

      function onScroll() {
        const max = document.documentElement.scrollHeight - innerHeight;
        els.progress.style.width = `${max > 0 ? Math.min(100, scrollY / max * 100) : 0}%`;
        els.backTop.classList.toggle('show', scrollY > 600);
      }

      els.search.addEventListener('input', e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => searchDocument(e.target.value), 180); });
      els.clear.addEventListener('click', () => { els.search.value = ''; searchDocument(''); els.search.focus(); });
      els.theme.addEventListener('click', toggleTheme);
      els.menu.addEventListener('click', () => els.sidebar.classList.contains('open') ? closeMenu() : openMenu());
      els.overlay.addEventListener('click', closeMenu);
      els.backTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
      els.reload.addEventListener('click', loadMarkdown);
      els.print.addEventListener('click', () => print());
      addEventListener('scroll', onScroll, { passive: true });
      addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); els.search.focus(); if (innerWidth <= 980) openMenu(); } });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!localStorage.getItem('readme-theme')) applyTheme('auto'); });

      applyTheme(CONFIG.rememberTheme ? (localStorage.getItem('readme-theme') || 'auto') : 'auto');
      onScroll(); loadMarkdown();
    })();
  </script>
</body>
</html>
